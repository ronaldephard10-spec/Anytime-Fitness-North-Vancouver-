<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B286D"/>
      <stop offset="100%" stop-color="#2D1544"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D26A"/>
      <stop offset="100%" stop-color="#00A854"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with Safe Margin -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield / Badge Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6C3EA3" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>
  
  <!-- Central Shield -->
  <g filter="url(#shadow)">
    <path d="M256 96 L376 148 V260 C376 336 324 402 256 428 C188 402 136 336 136 260 V148 Z" 
          fill="#582C80" stroke="#8E44AD" stroke-width="6"/>
    
    <!-- Anytime Running Figure / Clean Star Accent -->
    <path d="M256 140 L280 200 L345 205 L295 245 L312 308 L256 272 L200 308 L217 245 L167 205 L232 200 Z"
          fill="#8E44AD" opacity="0.35"/>

    <!-- Certified Checkmark -->
    <path d="M196 264 L238 306 L324 206" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Anytime Running Man Emblem Silhouette in Header -->
  <circle cx="256" cy="184" r="14" fill="#FFFFFF" opacity="0.9"/>
  <!-- Subtext AF NWV -->
  <text x="256" y="375" text-anchor="middle" fill="#E8D5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="4">AF NORTHWOODS</text>
  <text x="256" y="398" text-anchor="middle" fill="#00D26A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="2">CLEAN AUDIT PRO</text>
</svg>
